# Single-node Garage. Secrets are read from files, never written here.
# Only the S3 API is published (127.0.0.1:4703 -> 3900). RPC and the admin API
# stay inside the Compose network.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1

rpc_bind_addr = "127.0.0.1:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret_file = "/run/inspection-secrets/objectstore/rpc_secret"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"

[admin]
api_bind_addr = "0.0.0.0:3903"
admin_token_file = "/run/inspection-secrets/objectstore/admin_token"
