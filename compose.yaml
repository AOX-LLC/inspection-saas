name: inspection-saas

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-api-build: &api-build
  context: ./api
  target: runtime

x-api-image: &api-image inspection-saas-api:local

# Memory limits keep the stack a polite neighbour on a small shared host.
services:
  secrets:
    mem_limit: 64m
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
    user: "0:0"
    entrypoint: ["/bin/sh", "/generate.sh"]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - secrets:/secrets
      # Mounted only so the script can hand it to the object store's user.
      - objectdata:/objectdata
      - ./infra/secrets/generate.sh:/generate.sh:ro

  db:
    mem_limit: 512m
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
    environment:
      POSTGRES_PASSWORD_FILE: /run/inspection-secrets/db/postgres_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=peer"
    volumes:
      - pgdata:/var/lib/postgresql
      # Only the database's own secrets, not the whole volume.
      - type: volume
        source: secrets
        target: /run/inspection-secrets/db
        read_only: true
        volume:
          subpath: db
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:4702:5432"
    security_opt: ["no-new-privileges:true"]
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      # TCP on purpose: the init-time temporary server listens only on the
      # socket, so this stays unhealthy until the init scripts have finished.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "postgres", "-d", "inspection"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  migrate:
    mem_limit: 256m
    <<: *hardening
    build: *api-build
    image: *api-image
    user: "10002:10002"
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: demo
    volumes:
      - secrets:/run/inspection-secrets:ro
    depends_on:
      db:
        condition: service_healthy

  objectstore:
    mem_limit: 128m
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Not root: it can then read only the secrets group-shared with it.
    user: "10004:10004"
    volumes:
      - objectdata:/var/lib/garage
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      # Only the object store's own secrets, not the whole volume.
      - type: volume
        source: secrets
        target: /run/inspection-secrets/objectstore
        read_only: true
        volume:
          subpath: objectstore
    # Only the S3 API is published. RPC (3901) and the admin API (3903) are not.
    ports:
      - "127.0.0.1:4703:3900"
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      # The image has no shell or curl; the binary's own status call is the probe.
      test: ["CMD", "/garage", "status"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # Garage starts with no layout, bucket or key. This creates them, then exits.
  objectstore-init:
    mem_limit: 128m
    <<: *hardening
    build: *api-build
    image: *api-image
    user: "10004:10004"
    group_add: ["10005"]
    command: ["python", "-m", "app.storage.init"]
    environment:
      APP_ENV: demo
      # The object store's CORS allows this origin and no other.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:4700}
    volumes:
      - secrets:/run/inspection-secrets:ro
    depends_on:
      objectstore:
        condition: service_healthy

  seed:
    mem_limit: 256m
    <<: *hardening
    build: *api-build
    image: *api-image
    user: "10002:10002"
    group_add: ["10005"]
    command: ["python", "-m", "app.seed"]
    environment:
      APP_ENV: demo
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:4703}
    volumes:
      - secrets:/run/inspection-secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      objectstore-init:
        condition: service_completed_successfully

  api:
    mem_limit: 256m
    <<: *hardening
    build: *api-build
    image: *api-image
    group_add: ["10005"]
    environment:
      APP_ENV: demo
      MODEL_MODE: ${MODEL_MODE:-mock}
      # The address a browser on this machine reaches the object store at.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:4703}
      # The web app's origin: the only one allowed to make state-changing requests.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:4700}
      # The web service forwards each client's address in X-Forwarded-For. It is
      # believed from this service only; a request straight to this port is not.
      TRUSTED_PROXIES: web
    volumes:
      - secrets:/run/inspection-secrets:ro
    ports:
      - "127.0.0.1:4701:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      objectstore-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Background jobs: tiling now, and later the model pass and reports. The same
  # image as the API, run as the worker role. It decodes whole photos, so its
  # memory limit is the largest of the application services: a 50-megapixel
  # photo peaks near 500 MB while it is decoded, so one job at a time fits and
  # two would not. Raise WORKER_CONCURRENCY only together with this limit.
  worker:
    mem_limit: 768m
    <<: *hardening
    build: *api-build
    image: *api-image
    user: "10006:10006"
    group_add: ["10005"]
    # One worker serves every org, so a crash must not stop tiling until someone notices.
    restart: unless-stopped
    pids_limit: 128
    cpus: 2
    command: ["python", "-m", "app.worker"]
    # Time to finish the job in hand after SIGTERM before it is killed.
    stop_grace_period: 30s
    environment:
      APP_ENV: demo
      MODEL_MODE: ${MODEL_MODE:-mock}
      # Tiling and worker settings; see .env.example.
      TILE_SIZE: ${TILE_SIZE:-640}
      TILE_OVERLAP: ${TILE_OVERLAP:-128}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-50000000}
      MAX_TILES_PER_PHOTO: ${MAX_TILES_PER_PHOTO:-512}
      TILE_JPEG_QUALITY: ${TILE_JPEG_QUALITY:-85}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      JOB_LOCK_SECONDS: ${JOB_LOCK_SECONDS:-300}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-300}
      ABANDONED_UPLOAD_SECONDS: ${ABANDONED_UPLOAD_SECONDS:-3600}
    volumes:
      - secrets:/run/inspection-secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      objectstore-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The web app: a production Next.js build, built inside the image. It forwards
  # /api/* to the API so the session cookie stays same-origin; it holds no business
  # logic. Photo bytes never pass through it: the browser sends them to the object store.
  web:
    mem_limit: 256m
    <<: *hardening
    build:
      context: ./web
      args:
        API_ORIGIN: http://api:8000
    image: inspection-saas-web:local
    environment:
      # The object store's address as the browser reaches it, for the page's
      # Content-Security-Policy. Read when a page is served, not at build time.
      S3_PUBLIC_ORIGIN: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:4703}
      # --import: put the connecting address on X-Forwarded-For before Next.js forwards
      # a request, so the API is never handed an address the client chose (see
      # web/server/forwarded-for.mjs). The heap is capped at about half the container's
      # limit, so it cannot be what the limit kills first.
      NODE_OPTIONS: --import /app/server/preload.mjs --max-old-space-size=160
    ports:
      - "127.0.0.1:4700:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s

  test:
    mem_limit: 512m
    <<: *hardening
    profiles: [test]
    build:
      context: ./api
      target: test
    image: inspection-saas-api:test
    user: "10003:10003"
    group_add: ["10001", "10002", "10005", "10006"]
    environment:
      APP_ENV: test
      DB_NAME: inspection_test
      # Tests fetch presigned URLs from inside this container, so they are
      # signed for the object store's name on the Compose network.
      S3_PUBLIC_ENDPOINT: http://objectstore:3900
    volumes:
      - secrets:/run/inspection-secrets:ro
    depends_on:
      db:
        condition: service_healthy
      objectstore-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  secrets:
  objectdata:
